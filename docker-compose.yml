services:
  db:
    image: postgres:17-alpine
    container_name: epm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: epm_dev
    ports:
      - "5433:5432"
    volumes:
      - epm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - epm-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epm-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/epm_dev
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - epm-network

volumes:
  epm_postgres_data:

networks:
  epm-network:
    driver: bridge
